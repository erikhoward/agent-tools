# git-cliff configuration — Keep a Changelog format.
# https://git-cliff.org/docs/configuration
#
# Emits a Keep a Changelog (https://keepachangelog.com/en/1.1.0/) changelog
# from Conventional Commits (https://www.conventionalcommits.org/). The release
# workflow (.github/workflows/release.yml) regenerates CHANGELOG.md from this
# config on every v* tag push.

[remote.github]
owner = "erikhoward"
repo = "agent-tools"

[changelog]
# Rendered once at the top of the changelog. Kept in sync with the hand-seeded
# CHANGELOG.md header so the first release run produces no header diff.
header = """
# Changelog\n
All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# Rendered once per release. Groups commits by their Keep a Changelog section.
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
# Rendered once at the bottom. Emits a reference link per release: a compare
# link when a previous release exists, or a commits link for the first release.
footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                /compare/{{ release.previous.version }}..{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                /commits/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
            /compare/{{ release.previous.version }}..HEAD
    {% endif -%}
{% endfor %}
"""
# Strip leading/trailing whitespace from the rendered body.
trim = true

[git]
# Parse commits according to the Conventional Commits specification.
conventional_commits = true
# Exclude non-conventional commits (merge commits, "initial commit", etc.).
filter_unconventional = true
commit_parsers = [
    # Breaking changes get their own section (checked first so they win over the type rules below).
    { body = ".*BREAKING[ -]CHANGE.*", group = "Breaking Changes" },
    { message = "^[a-z]+(\\([^)]*\\))?!:", group = "Breaking Changes" },
    # Conventional types mapped to Keep a Changelog sections.
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Changed" },
    { message = "^refactor", group = "Changed" },
    { message = "^docs", group = "Changed" },
    { message = "^test", group = "Changed" },
    # Omit noisy churn.
    { message = "^(chore|build|ci)", skip = true },
    { message = "^revert", skip = true },
]
# Keep breaking commits even if a later parser would skip them.
protect_breaking_commits = true
# Keep commits unmatched by a parser (they fall through to no group, so they are omitted).
filter_commits = false
# Only treat v* tags as releases.
tag_pattern = "v[0-9].*"
# Oldest commit first within each section.
sort_commits = "oldest"
